# /etc/self-heal.conf — configuration for the Self-Heal engine
# Uncomment and change any value to override the built-in default.
# The script ships with sane defaults; everything below is optional.

# ---- General -----------------------------------------------------------
# Show KDE desktop notifications when fixes are applied (1/0)
#NOTIFICATIONS=1

# ---- System tier (root) ------------------------------------------------
# Failed system units are auto-restarted ONLY if listed here (space separated)
#SERVICE_ALLOWLIST="NetworkManager cups bluetooth chronyd sshd systemd-resolved"

# Disk usage % on / that triggers cleanup (journal vacuum, dnf clean, flatpak unused)
#DISK_THRESHOLD=85
# Disk usage % that triggers a critical warning notification
#DISK_CRITICAL=92

# Cap for /var/log/journal; older logs vacuumed away when exceeded
#JOURNAL_MAX=500M

# /boot usage % that triggers a warning
#BOOT_THRESHOLD=80

# Keep this many kernels when AUTO_REMOVE_OLD_KERNELS is enabled
#KERNELS_KEEP=2
# Allow automatic removal of old kernels when /boot fills up (0/1) — opt-in!
#AUTO_REMOVE_OLD_KERNELS=0

# Rebuild the RPM database automatically if corruption is detected (1/0)
#AUTO_FIX_RPMDB=1

# Cancel stuck print jobs when the queue can't be serviced (1/0)
#AUTO_CANCEL_CUPS=1

# Run 'flatpak repair' on system installations (1/0)
#FLATPAK_REPAIR=1

# Automatically bounce NetworkManager after N consecutive runs without net (1/0)
#NETWORK_AUTO_BOUNCE=1
#NET_FAILS_BEFORE_BOUNCE=3

# Check SMART health of disks and warn on failure (1/0)
#SMART_CHECK=1

# Detect BTRFS errors in the journal and warn (1/0); scrub runs via its own timer
#BTRFS_WATCH=1

# If zram is active, keep vm.swappiness at the zram-friendly 180 (1/0)
#SWAPPINESS_FIX=1

# ---- User tier (no root) ----------------------------------------------
# Failed user units auto-restarted only if listed here
#USER_SERVICE_ALLOWLIST="pipewire pipewire-pulse wireplumber xdg-desktop-portal xdg-desktop-portal-gtk xdg-desktop-portal-kde plasma-plasmashell"

# Auto-restart PipeWire/WirePlumber when audio is dead (1/0)
#AUDIO_AUTO_FIX=1

# Max size (MB) of ~/.cache before old files (30+ days unused) are purged
#USER_CACHE_MAX_MB=2048
# Max size (MB) of ~/.cache/thumbnails before they are purged
#THUMBNAIL_MAX_MB=300

# Run 'flatpak repair --user' when user flatpaks are installed (1/0)
#USER_FLATPAK_REPAIR=1
